name: install-tests

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/install-tests.yml
      - .github/scripts/e2e-install-unix.sh
      - .github/scripts/e2e-install-windows.ps1
      - scripts/**
  pull_request:
    paths:
      - .github/workflows/install-tests.yml
      - .github/scripts/e2e-install-unix.sh
      - .github/scripts/e2e-install-windows.ps1
      - scripts/**

jobs:
  test-native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: macos-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    env:
      MIRROR_URL: http://${{ secrets.PUBLIC_URL }}:1357
    steps:
      - uses: actions/checkout@v4

      - name: Unix install tests
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/e2e-install-unix.sh

      - name: Windows install tests
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          .github/scripts/e2e-install-windows.ps1

  test-linux-containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-glibc
            platform: linux/amd64
            image: ubuntu:22.04
            install_deps: apt-get update && apt-get install -y curl ca-certificates bash python3
          - name: linux-arm64-glibc
            platform: linux/arm64
            image: ubuntu:22.04
            install_deps: apt-get update && apt-get install -y curl ca-certificates bash python3
          - name: linux-x64-musl
            platform: linux/amd64
            image: alpine:3.19
            install_deps: apk add --no-cache bash curl ca-certificates python3
          - name: linux-arm64-musl
            platform: linux/arm64
            image: alpine:3.19
            install_deps: apk add --no-cache bash curl ca-certificates python3
    env:
      MIRROR_URL: http://${{ secrets.PUBLIC_URL }}:1357
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Run install tests in container
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -e MIRROR_URL="${MIRROR_URL}" \
            -v "${PWD}:/work" \
            -w /work \
            ${{ matrix.image }} \
            /bin/sh -c "${{ matrix.install_deps }} && bash /work/.github/scripts/e2e-install-unix.sh"
